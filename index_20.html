<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Surgical Ward Tracker</title>
<meta name="description" content="Ward-round tracker for a 54-bed male surgical ward">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* ==========================================================================
   DESIGN SYSTEM
   ========================================================================== */
:root{
  --bg:#f3f4f6;
  --card:#ffffff;
  --text:#1f2937;
  --text-muted:#6b7280;
  --text-faint:#9ca3af;
  --border:#e2e5ea;
  --border-strong:#d1d5db;
  --primary:#1e3a5f;
  --primary-dark:#152a45;
  --primary-bg:#eaf0f7;
  --green:#15803d;
  --green-bg:#e6f4ea;
  --purple:#6d28d9;
  --purple-bg:#f1eafc;
  --orange:#b45309;
  --orange-bg:#fdf1de;
  --red:#b91c1c;
  --red-bg:#fbeaea;
  --blue:#1d4ed8;
  --blue-bg:#e9f0fd;
  --grey:#6b7280;
  --grey-bg:#eceef1;
  --radius:10px;
  --radius-sm:6px;
  --shadow:0 1px 2px rgba(16,24,40,0.06);
  font-size:16px;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:24px;
}
h1,h2,h3,h4{margin:0;font-weight:700;color:var(--text);}
p{margin:0;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:1rem;}
::selection{background:var(--primary-bg);}

/* Layout */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:20;
}
.topbar-left{display:flex;flex-direction:column;gap:2px;}
.topbar-left h1{font-size:1.15rem;letter-spacing:-0.01em;}
.date-display{font-size:0.78rem;color:var(--text-muted);}
.topbar-right{display:flex;align-items:center;gap:8px;}
.demo-badge{
  background:var(--orange-bg);color:var(--orange);font-weight:700;font-size:0.7rem;
  padding:4px 8px;border-radius:6px;letter-spacing:0.03em;
}
.conn-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:4px;}
.conn-dot.off{background:var(--red);}

.mainnav{
  display:flex;gap:4px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--border);
  position:sticky;top:56px;z-index:19;overflow-x:auto;
}
.nav-btn{
  flex:1 1 auto;white-space:nowrap;background:none;border:none;padding:10px 12px;border-radius:8px;
  font-size:0.88rem;font-weight:600;color:var(--text-muted);cursor:pointer;min-height:40px;
}
.nav-btn.active{background:var(--primary-bg);color:var(--primary);}
.nav-btn .nav-count{
  display:inline-block;margin-left:4px;background:var(--red-bg);color:var(--red);
  font-size:0.65rem;font-weight:700;border-radius:8px;padding:1px 5px;
}
.nav-btn .nav-count[hidden]{display:none;}
[hidden]{display:none;}

@media(max-width:480px){
  .topbar{padding:10px 12px;}
  .topbar-left h1{font-size:1rem;}
  .mainnav{padding:6px 6px;gap:2px;}
  .nav-btn{padding:8px 4px;font-size:0.72rem;min-height:36px;}
  main{padding:10px;}
  .bed-card{min-width:100px;min-height:88px;}
}

main{max-width:1200px;margin:0 auto;padding:14px;}
.view{display:none;}
.view.active{display:block;}

/* Summary bar */
.summary-bar{
  display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px;
}
@media(min-width:700px){.summary-bar{grid-template-columns:repeat(5,1fr);}}
.summary-tile{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 12px;text-align:left;
}
.summary-tile .num{font-size:1.4rem;font-weight:800;line-height:1.1;}
.summary-tile .lbl{font-size:0.72rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.03em;}
.summary-tile.occ .num{color:var(--primary);}
.summary-tile.empty .num{color:var(--grey);}
.summary-tile.jobs .num{color:var(--red);}
.summary-tile.theatre .num{color:var(--purple);}
.summary-tile.disch .num{color:var(--green);}

/* Controls bar */
.controls-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center;}
.controls-bar input[type=search],.controls-bar select{
  flex:1 1 160px;padding:10px 12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--card);
  min-height:42px;
}
.controls-bar input[type=search]{flex:2 1 220px;}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 14px;border-radius:8px;border:1px solid var(--border-strong);background:var(--card);
  color:var(--text);font-weight:600;font-size:0.88rem;cursor:pointer;min-height:42px;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-danger{background:var(--red-bg);border-color:var(--red-bg);color:var(--red);}
.btn-success{background:var(--green-bg);border-color:var(--green-bg);color:var(--green);}
.btn-sm{padding:6px 10px;font-size:0.8rem;min-height:34px;}
.btn-block{width:100%;}
.btn-link{background:none;border:none;color:var(--primary);font-weight:600;cursor:pointer;padding:2px 4px;font-size:0.85rem;}
.btn[disabled]{opacity:0.5;cursor:not-allowed;}

/* Ward grid */
.ward-grid{display:grid;gap:8px;overflow-x:auto;padding-bottom:8px;}
.bed-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:8px 9px;min-width:118px;min-height:98px;cursor:pointer;display:flex;flex-direction:column;gap:3px;
  box-shadow:var(--shadow);position:relative;
}
.bed-card:active{transform:scale(0.98);}
.bed-card.empty{background:var(--grey-bg);border-style:dashed;justify-content:center;align-items:center;text-align:center;}
.bed-card .bed-label{font-size:0.68rem;font-weight:800;color:var(--text-muted);letter-spacing:0.04em;}
.bed-card .bed-zone{font-size:0.6rem;color:var(--text-faint);}
.bed-card .bed-patient-name{font-size:0.9rem;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bed-card .bed-diagnosis{font-size:0.74rem;color:var(--text-muted);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.bed-card .bed-empty-text{font-size:0.72rem;font-weight:700;color:var(--text-faint);letter-spacing:0.05em;}
.bed-card .bed-add{font-size:0.72rem;color:var(--primary);font-weight:700;}
.bed-card.dimmed{opacity:0.32;}
.bed-card.match{outline:2px solid var(--primary);}
.bed-badges{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto;}
.badge{
  font-size:0.62rem;font-weight:800;padding:2px 6px;border-radius:5px;letter-spacing:0.02em;white-space:nowrap;
}
.badge-theatre{background:var(--purple-bg);color:var(--purple);}
.badge-discharge{background:var(--green-bg);color:var(--green);}
.badge-preop{background:var(--blue-bg);color:var(--blue);}
.badge-postop{background:var(--blue-bg);color:var(--blue);}
.badge-pod{background:var(--grey-bg);color:var(--text);}
.badge-referral{background:var(--orange-bg);color:var(--orange);}
.badge-jobs{background:var(--red-bg);color:var(--red);}
.badge-critical{background:var(--red-bg);color:var(--red);}

/* Cards / lists generic */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);}
.card h3{font-size:0.95rem;margin-bottom:8px;}
.list-row{
  display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);
}
.list-row:last-child{border-bottom:none;}
.empty-state{color:var(--text-faint);font-size:0.88rem;padding:14px 4px;text-align:center;}

/* Jobs / theatre / discharge rows */
.job-row,.theatre-row,.discharge-row{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;
}
.job-row.done{opacity:0.6;}
.row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.row-bed-tag{font-size:0.7rem;font-weight:800;color:var(--primary);background:var(--primary-bg);padding:2px 7px;border-radius:6px;}
.row-title{font-weight:700;font-size:0.95rem;margin:4px 0 2px;}
.row-sub{font-size:0.8rem;color:var(--text-muted);}
.row-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}

/* Patient page */
.patient-header{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.patient-header .back-row{margin-bottom:8px;}
.patient-bed{font-size:0.78rem;font-weight:800;color:var(--primary);letter-spacing:0.04em;}
.patient-header h2{font-size:1.4rem;margin:2px 0 4px;}
.patient-diagnosis-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.patient-diagnosis-row span{font-size:1rem;color:var(--text);font-weight:600;}
.status-pill{
  display:inline-block;font-size:0.72rem;font-weight:800;padding:4px 10px;border-radius:20px;
  background:var(--primary-bg);color:var(--primary);letter-spacing:0.03em;text-transform:uppercase;
}
.patient-badges{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;}
.patient-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}

.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:12px;border-bottom:1px solid var(--border);}
.tab-btn{
  background:none;border:none;padding:10px 12px;font-size:0.83rem;font-weight:600;color:var(--text-muted);
  cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;
}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);}

/* Forms */
.form-group{margin-bottom:12px;}
.form-group label{display:block;font-size:0.8rem;font-weight:700;color:var(--text-muted);margin-bottom:4px;}
.form-group input[type=text],.form-group input[type=number],.form-group input[type=date],
.form-group input[type=time],.form-group input[type=datetime-local],.form-group select,.form-group textarea{
  width:100%;padding:10px 11px;border:1px solid var(--border-strong);border-radius:8px;background:#fff;min-height:42px;
}
.form-group textarea{min-height:84px;resize:vertical;}
.form-row{display:flex;gap:10px;}
.form-row .form-group{flex:1;}
.checkbox-row{display:flex;align-items:center;gap:10px;padding:8px 0;}
.checkbox-row input[type=checkbox]{width:20px;height:20px;flex-shrink:0;}
.checkbox-row label{font-size:0.88rem;font-weight:600;color:var(--text);}
.yesno{display:flex;gap:8px;}
.yesno button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--border-strong);background:#fff;font-weight:700;cursor:pointer;min-height:42px;}
.yesno button.active-yes{background:var(--green-bg);border-color:var(--green);color:var(--green);}
.yesno button.active-no{background:var(--grey-bg);border-color:var(--border-strong);color:var(--text-muted);}
.hint{font-size:0.74rem;color:var(--text-faint);margin-top:3px;}

/* Checklist */
.checklist-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.checklist-item:last-child{border-bottom:none;}
.checklist-item input{width:22px;height:22px;flex-shrink:0;}
.checklist-item span{font-size:0.9rem;font-weight:600;}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,0.5);display:none;align-items:flex-end;justify-content:center;z-index:100;
}
.modal-overlay.open{display:flex;}
.modal-box{
  background:#fff;border-radius:14px 14px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  padding:18px;box-shadow:0 -4px 24px rgba(0,0,0,0.2);
}
@media(min-width:640px){
  .modal-overlay{align-items:center;}
  .modal-box{border-radius:14px;margin:20px;}
}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.modal-header h3{font-size:1.05rem;}
.modal-close{background:none;border:none;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--text-muted);padding:4px 8px;}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;}
.modal-footer .btn{flex:1;}

/* Toasts */
#toast-container{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:420px;}
.toast{background:var(--text);color:#fff;padding:12px 16px;border-radius:8px;font-size:0.86rem;box-shadow:0 4px 14px rgba(0,0,0,0.25);}
.toast.error{background:var(--red);}
.toast.success{background:var(--green);}

/* Move/swap bed picker */
.bedpicker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;max-height:340px;overflow-y:auto;padding:4px;}
.bedpick{
  border:1px solid var(--border-strong);border-radius:8px;padding:8px 4px;text-align:center;cursor:pointer;background:#fff;font-size:0.72rem;font-weight:700;
}
.bedpick.occupied{background:var(--primary-bg);color:var(--primary);}
.bedpick.current{background:var(--grey-bg);color:var(--text-faint);cursor:not-allowed;}
.bedpick.empty{background:var(--green-bg);color:var(--green);}

/* Settings */
.settings-section{margin-bottom:20px;}
.staff-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:8px;}
.staff-role-tag{font-size:0.68rem;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--grey-bg);color:var(--text-muted);}
.layout-table{width:100%;border-collapse:collapse;font-size:0.82rem;}
.layout-table th{text-align:left;padding:6px 4px;color:var(--text-muted);font-size:0.72rem;text-transform:uppercase;border-bottom:1px solid var(--border);}
.layout-table td{padding:5px 4px;border-bottom:1px solid var(--border);}
.layout-table input{width:100%;padding:6px 7px;border:1px solid var(--border-strong);border-radius:6px;min-height:34px;}
.layout-scroll{max-height:460px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:6px;}

.section-title{font-size:0.95rem;font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.muted{color:var(--text-muted);}
.small{font-size:0.78rem;}
.timeline-item{padding:8px 0;border-bottom:1px solid var(--border);font-size:0.84rem;}
.timeline-item:last-child{border-bottom:none;}
.timeline-time{font-weight:700;color:var(--primary);margin-right:6px;}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <h1>Surgical Ward Tracker</h1>
    <span class="date-display" id="current-date"></span>
  </div>
  <div class="topbar-right">
    <span id="demo-badge" class="demo-badge" hidden title="Supabase is not configured. Data is only saved in this browser.">DEMO MODE</span>
    <button class="btn btn-ghost btn-sm" id="btn-refresh" title="Reload latest data">&#8635; Refresh</button>
  </div>
</header>

<nav class="mainnav" id="main-nav">
  <button class="nav-btn active" data-view="ward">Ward</button>
  <button class="nav-btn" data-view="jobs">Jobs<span class="nav-count" id="nav-jobs-count" hidden>0</span></button>
  <button class="nav-btn" data-view="theatre">Theatre</button>
  <button class="nav-btn" data-view="discharges">Discharges</button>
  <button class="nav-btn" data-view="settings">Settings</button>
</nav>

<main id="main">

  <!-- ============================== WARD VIEW ============================== -->
  <section class="view active" id="view-ward">
    <div class="summary-bar" id="ward-summary"></div>
    <div class="controls-bar">
      <input type="search" id="ward-search" placeholder="Search name, bed, diagnosis, BHT...">
      <select id="ward-filter">
        <option value="all">All</option>
        <option value="occupied">Occupied</option>
        <option value="empty">Empty</option>
        <option value="theatre">Theatre today</option>
        <option value="discharge">For discharge</option>
        <option value="preop">Pre-op</option>
        <option value="postop">Post-op</option>
      </select>
      <button class="btn btn-primary" id="btn-new-admission">+ New Admission</button>
    </div>
    <div class="ward-grid" id="ward-grid"></div>
  </section>

  <!-- ============================== JOBS VIEW ============================== -->
  <section class="view" id="view-jobs">
    <div class="controls-bar">
      <input type="search" id="jobs-search" placeholder="Search jobs, patient, bed...">
      <select id="jobs-filter">
        <option value="outstanding" selected>Outstanding</option>
        <option value="done">Done</option>
        <option value="all">All</option>
      </select>
    </div>
    <div id="jobs-list"></div>
  </section>

  <!-- ============================== THEATRE VIEW ============================== -->
  <section class="view" id="view-theatre">
    <h2 class="section-title">Theatre today</h2>
    <div id="theatre-list"></div>
  </section>

  <!-- ============================== DISCHARGES VIEW ============================== -->
  <section class="view" id="view-discharges">
    <h2 class="section-title">For discharge</h2>
    <div id="discharges-list"></div>
  </section>

  <!-- ============================== SETTINGS VIEW ============================== -->
  <section class="view" id="view-settings">
    <div class="settings-section">
      <div class="card">
        <div class="section-title">Connection</div>
        <p class="small muted" id="settings-conn-info"></p>
      </div>
    </div>
    <div class="settings-section">
      <div class="card">
        <div class="section-title">Ward Team <button class="btn btn-sm btn-primary" id="btn-add-staff">+ Add doctor</button></div>
        <div id="staff-list"></div>
      </div>
    </div>
    <div class="settings-section">
      <div class="card">
        <div class="section-title">Ward Layout <button class="btn btn-sm btn-primary" id="btn-save-layout">Save Layout</button></div>
        <p class="small muted" style="margin-bottom:10px;">Set the row, column and zone for each bed so the ward map matches the real ward. Leave gaps in numbering for aisles, entrances or the nurses' station.</p>
        <div class="layout-scroll">
          <table class="layout-table">
            <thead><tr><th>Bed</th><th>Row</th><th>Column</th><th>Zone</th></tr></thead>
            <tbody id="layout-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <!-- ============================== PATIENT VIEW ============================== -->
  <section class="view" id="view-patient">
    <div class="back-row">
      <button class="btn btn-ghost btn-sm" id="btn-back-to-ward">&larr; Back to ward</button>
    </div>
    <div class="patient-header">
      <div class="patient-bed" id="pv-bed"></div>
      <h2 id="pv-name"></h2>
      <div class="patient-diagnosis-row">
        <span id="pv-diagnosis"></span>
        <button class="btn-link" id="btn-edit-diagnosis">edit</button>
      </div>
      <span class="status-pill" id="pv-status"></span>
      <div class="patient-badges" id="pv-badges"></div>
      <div class="patient-actions">
        <button class="btn" id="btn-edit-patient">Edit patient</button>
        <button class="btn" id="btn-move-patient">Move / swap bed</button>
      </div>
    </div>
    <div class="tabs" id="patient-tabs">
      <button class="tab-btn active" data-tab="overview">Overview</button>
      <button class="tab-btn" data-tab="rounds">Rounds</button>
      <button class="tab-btn" data-tab="referrals">Referrals</button>
      <button class="tab-btn" data-tab="investigations">Investigations</button>
      <button class="tab-btn" data-tab="theatre">Theatre / Pre-op</button>
      <button class="tab-btn" data-tab="postop">Post-op / Devices</button>
      <button class="tab-btn" data-tab="discharge">Discharge / Transfer</button>
    </div>
    <div id="patient-tab-content"></div>
  </section>

</main>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modal-title">Title</h3>
      <button class="modal-close" id="modal-close">&times;</button>
    </div>
    <div id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<div id="toast-container"></div>

<script>
/* ============================================================================
   JavaScript is organized into the sections below (per project convention):
   Configuration / State / DB abstraction / Data loading / Ward rendering /
   Patient rendering / Rounds / Jobs / Referrals / Investigations / Theatre /
   Discharge / Settings / Utility functions
   ============================================================================ */
// ============================================================================
// CONFIGURATION
// Replace these two values with your own Supabase project's URL and
// publishable (anon) key. Find them in Supabase: Project Settings -> API.
// Never put your service_role key here — see README.md.
// ============================================================================
const SUPABASE_URL = "https://knhzdjbleeggdmhnpdnb.supabase.co";
const SUPABASE_KEY = "sb_publishable_1o3a9qb3SdWcht6IpKvcpg_v6_b8YbP";

const SUPABASE_CONFIGURED = !!(SUPABASE_URL && SUPABASE_KEY &&
  SUPABASE_URL.indexOf("YOUR_SUPABASE") === -1 &&
  SUPABASE_KEY.indexOf("YOUR_SUPABASE") === -1 &&
  SUPABASE_URL.indexOf("supabase.co") !== -1);

// Becomes true only once a Supabase client has actually been created

function esc(s){
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){
    const r = Math.random()*16|0, v = c==="x" ? r : (r&0x3|0x8);
    return v.toString(16);
  });
}

function nowIso(){ return new Date().toISOString(); }

function todayDateStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function nowTimeStr(){
  const d = new Date();
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}

function fmtDate(d){
  if (!d) return "";
  const dt = new Date(d);
  if (isNaN(dt)) return "";
  return dt.toLocaleDateString("en-GB", {day:"2-digit", month:"short"});
}

function fmtDateTime(d){
  if (!d) return "";
  const dt = new Date(d);
  if (isNaN(dt)) return "";
  return dt.toLocaleDateString("en-GB", {day:"2-digit", month:"short"}) + " " +
    dt.toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"});
}

function fmtTime(d){
  if (!d) return "";
  const dt = new Date(d);
  if (isNaN(dt)) return "";
  return dt.toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"});
}

function daysBetween(dateStrEarlier, dateStrLater){
  const a = new Date(dateStrEarlier + "T00:00:00");
  const b = new Date(dateStrLater + "T00:00:00");
  if (isNaN(a) || isNaN(b)) return null;
  return Math.round((b - a) / 86400000);
}

function podFor(patient){
  if (!patient.operation_date) return null;
  const n = daysBetween(patient.operation_date, todayDateStr());
  return n === null ? null : Math.max(n, 0);
}

function showToast(msg, type){
  const c = document.getElementById("toast-container");
  const el = document.createElement("div");
  el.className = "toast" + (type ? " " + type : "");
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(function(){ el.style.opacity = "0"; el.style.transition = "opacity 0.3s"; }, 2600);
  setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 3000);
}

function friendlyError(error){
  if (!error) return "Something went wrong.";
  const msg = error.message || String(error);
  if (msg.indexOf("patients_active_bed_unique") !== -1) return "That bed is already occupied.";
  if (msg.indexOf("duplicate key") !== -1) return "That record already exists.";
  return msg;
}

function byId(arr, id){ return arr.find(function(x){ return x.id === id; }); }

function bedLabel(bedId){
  const b = byId(state.beds, bedId);
  return b ? b.label : "?";

function patientTasks(patientId){

function patientReferrals(patientId){

function patientInvestigations(patientId){

// ============================================================================
// DB ABSTRACTION (Supabase or localStorage demo mode)
// Every function returns a promise resolving to {data, error} so calling
// code never has to branch on which backend is active.
// ============================================================================
const TABLES = ["beds","staff","patients","rounds","tasks","referrals","investigations","devices"];

let localDB = null;
function loadLocalDB(){
  try {
    const raw = localStorage.getItem(LOCAL_KEY);
    if (raw) { localDB = JSON.parse(raw); }
  } catch(e){ console.error("Failed to parse local demo DB", e); }
  if (!localDB) localDB = {};
  TABLES.forEach(function(t){ if (!Array.isArray(localDB[t])) localDB[t] = []; });
  if (localDB.beds.length === 0) seedLocalBeds();
}
function saveLocalDB(){
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(localDB)); }
  catch(e){ console.error("Failed to save local demo DB", e); showToast("Could not save to browser storage.", "error"); }
}
function seedLocalBeds(){
  const beds = [];
  for (let i=1;i<=TOTAL_BEDS;i++){
    const row = Math.floor((i-1)/6)+1;
    const col = ((i-1)%6)+1;
    beds.push({ id: uuid(), label: String(i), row_no: row, col_no: col, zone: "Main ward", created_at: nowIso() });
  }
  localDB.beds = beds;
}

const DB = {
  async select(table, opts){
    opts = opts || {};
    if (USE_SUPABASE){
      let q = supabaseClient.from(table).select("*");
      if (opts.eq) for (const k in opts.eq) q = q.eq(k, opts.eq[k]);
      if (opts.in) q = q.in(opts.in.col, opts.in.vals.length ? opts.in.vals : ["__none__"]);
      if (opts.order) q = q.order(opts.order.col, {ascending: opts.order.asc !== false});
      const res = await q;
      return { data: res.data || [], error: res.error };
    } else {
      let rows = (localDB[table] || []).slice();
      if (opts.eq) rows = rows.filter(function(r){
        return Object.keys(opts.eq).every(function(k){ return r[k] === opts.eq[k]; });
      });
      if (opts.in) rows = rows.filter(function(r){ return opts.in.vals.indexOf(r[opts.in.col]) !== -1; });
      if (opts.order) rows.sort(function(a,b){
        const av = a[opts.order.col], bv = b[opts.order.col];
        if (av < bv) return opts.order.asc === false ? 1 : -1;
        if (av > bv) return opts.order.asc === false ? -1 : 1;
        return 0;
      });
      return { data: rows, error: null };
    }
  },
  async insert(table, row){
    const record = Object.assign({}, row);
    if (!record.id) record.id = uuid();
    if (!record.created_at) record.created_at = nowIso();
    if (USE_SUPABASE){
      const res = await supabaseClient.from(table).insert(record).select().single();
      return { data: res.data, error: res.error };
    } else {
      localDB[table].push(record);
      saveLocalDB();
      return { data: record, error: null };
    }
  },
  async update(table, id, patch){
    if (USE_SUPABASE){
      const res = await supabaseClient.from(table).update(patch).eq("id", id).select().single();
      return { data: res.data, error: res.error };
    } else {
      const rows = localDB[table];
      const idx = rows.findIndex(function(r){ return r.id === id; });
      if (idx === -1) return { data: null, error: { message: "Record not found." } };
      rows[idx] = Object.assign({}, rows[idx], patch);
      saveLocalDB();
      return { data: rows[idx], error: null };
    }
  },
  async remove(table, id){
    if (USE_SUPABASE){
      const res = await supabaseClient.from(table).delete().eq("id", id);
      return { data: res.data, error: res.error };
    } else {
      const rows = localDB[table];
      const idx = rows.findIndex(function(r){ return r.id === id; });
      if (idx !== -1) rows.splice(idx,1);
      saveLocalDB();
      return { data: null, error: null };
    }
  }
};

// ============================================================================
// DATA LOADING
// ============================================================================
async function loadAll(){
  try {
    const bedsRes = await DB.select("beds", { order: { col: "row_no" } });
    if (bedsRes.error) throw bedsRes.error;
    state.beds = bedsRes.data;

    const staffRes = await DB.select("staff", { order: { col: "name" } });
    if (staffRes.error) throw staffRes.error;
    state.staff = staffRes.data;

    const patientsRes = await DB.select("patients", { eq: { active: true } });
    if (patientsRes.error) throw patientsRes.error;
    state.patients = patientsRes.data;

    const ids = state.patients.map(function(p){ return p.id; });

    if (ids.length === 0){
      state.tasks = []; state.referrals = []; state.investigations = [];
      state.devices = []; state.rounds = [];
    } else {
      const [tasksRes, refRes, invRes, devRes, roundsRes] = await Promise.all([
        DB.select("tasks", { in: { col: "patient_id", vals: ids } }),
        DB.select("referrals", { in: { col: "patient_id", vals: ids } }),
        DB.select("investigations", { in: { col: "patient_id", vals: ids } }),
        DB.select("devices", { in: { col: "patient_id", vals: ids } }),
        DB.select("rounds", { in: { col: "patient_id", vals: ids } })
      ]);
      if (tasksRes.error) throw tasksRes.error;
      if (refRes.error) throw refRes.error;
      if (invRes.error) throw invRes.error;
      if (devRes.error) throw devRes.error;
      if (roundsRes.error) throw roundsRes.error;
      state.tasks = tasksRes.data;
      state.referrals = refRes.data;
      state.investigations = invRes.data;
      state.devices = devRes.data;
      state.rounds = roundsRes.data;
    }
    state.loaded = true;
    return true;
  } catch(err){
    console.error(err);
    showToast("Could not load data: " + friendlyError(err), "error");
    return false;
  }
}

function scheduleReload(){
  clearTimeout(reloadDebounceTimer);
  reloadDebounceTimer = setTimeout(async function(){
    await loadAll();
    renderCurrentView();
  }, 350);
}

function setupRealtime(){
  if (!USE_SUPABASE) return;
  try {
    realtimeChannel = supabaseClient.channel("ward-changes");
    ["beds","patients","tasks","rounds","referrals","investigations","devices"].forEach(function(t){
      realtimeChannel.on("postgres_changes", { event: "*", schema: "public", table: t }, function(){
        scheduleReload();
      });
    });
    realtimeChannel.subscribe();
  } catch(e){
    console.warn("Realtime unavailable, falling back to manual refresh.", e);
  }
}

// ============================================================================
function computeBadges(patient){
  const badges = [];
  const pending = pendingTaskCount(patient.id);
  const refPending = pendingReferralCount(patient.id);
  if (patient.surgery_today) badges.push({ cls: "badge-theatre", text: "THEATRE" });
  if (patient.for_discharge) badges.push({ cls: "badge-discharge", text: "DISCHARGE" });
  if (patient.status === "Pre-op") badges.push({ cls: "badge-preop", text: "PRE-OP" });
  if (patient.status === "Post-op"){
    const pod = podFor(patient);
    badges.push({ cls: "badge-postop", text: pod !== null ? "POD "+pod : "POST-OP" });
  }
  if (patient.status === "Critical") badges.push({ cls: "badge-critical", text: "CRITICAL" });
  if (refPending > 0) badges.push({ cls: "badge-referral", text: "REFERRAL" });
  if (pending > 0) badges.push({ cls: "badge-jobs", text: pending + (pending===1?" JOB":" JOBS") });
  return badges;
}
function badgesHtml(patient, max){
  const badges = computeBadges(patient).slice(0, max || 99);
  return badges.map(function(b){ return '<span class="badge '+b.cls+'">'+esc(b.text)+'</span>'; }).join("");
}

function updateCurrentDate(){
  const d = new Date();
  document.getElementById("current-date").textContent = d.toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
}

function computeWardSummary(){
  const occupied = state.patients.length;
  const empty = TOTAL_BEDS - occupied;
  const pendingJobs = state.tasks.filter(function(t){ return t.status === "Pending"; }).length;
  const theatreToday = state.patients.filter(function(p){ return p.surgery_today; }).length;
  const forDischarge = state.patients.filter(function(p){ return p.for_discharge; }).length;
  return { occupied: occupied, empty: empty, pendingJobs: pendingJobs, theatreToday: theatreToday, forDischarge: forDischarge };
}

function renderWardSummary(){
  const s = computeWardSummary();
  document.getElementById("ward-summary").innerHTML =
    tile("occ", s.occupied, "Occupied beds") +
    tile("empty", s.empty, "Empty beds") +
    tile("jobs", s.pendingJobs, "Pending jobs") +
    tile("theatre", s.theatreToday, "Theatre today") +
    tile("disch", s.forDischarge, "For discharge");
  function tile(cls, num, lbl){
    return '<div class="summary-tile '+cls+'"><div class="num">'+num+'</div><div class="lbl">'+lbl+'</div></div>';
  }
  const navCount = document.getElementById("nav-jobs-count");
  if (s.pendingJobs > 0){ navCount.hidden = false; navCount.textContent = s.pendingJobs; }
  else { navCount.hidden = true; }
}

function bedMatchesFilter(bed, patient, filter){
  switch(filter){
    case "occupied": return !!patient;
    case "empty": return !patient;
    case "theatre": return !!patient && patient.surgery_today;
    case "discharge": return !!patient && patient.for_discharge;
    case "preop": return !!patient && patient.status === "Pre-op";
    case "postop": return !!patient && patient.status === "Post-op";
    default: return true;
  }
}
function bedMatchesSearch(bed, patient, term){
  if (!term) return true;
  term = term.toLowerCase();
  if (bed.label.toLowerCase().indexOf(term) !== -1) return true;
  if (!patient) return false;
  return (patient.name||"").toLowerCase().indexOf(term) !== -1 ||
         (patient.diagnosis||"").toLowerCase().indexOf(term) !== -1 ||
         (patient.bht_no||"").toLowerCase().indexOf(term) !== -1;
}

function renderWardGrid(){
  const grid = document.getElementById("ward-grid");
  const beds = state.beds;
  if (beds.length === 0){
    grid.innerHTML = '<p class="empty-state">No beds configured yet. Add beds under Settings &rarr; Ward Layout.</p>';
    return;
  }
  const maxRow = Math.max.apply(null, beds.map(function(b){ return b.row_no; }).concat([1]));
  const maxCol = Math.max.apply(null, beds.map(function(b){ return b.col_no; }).concat([1]));
  grid.style.gridTemplateColumns = "repeat(" + maxCol + ", minmax(110px, 1fr))";
  grid.style.gridTemplateRows = "repeat(" + maxRow + ", auto)";

  const term = state.wardSearch.trim();
  const filter = state.wardFilter;
  const patientByBed = {};
  state.patients.forEach(function(p){ if (p.bed_id) patientByBed[p.bed_id] = p; });

  let html = "";
  beds.forEach(function(bed){
    const patient = patientByBed[bed.id];
    const matchesFilter = bedMatchesFilter(bed, patient, filter);
    if (!matchesFilter) return;
    const matchesSearch = bedMatchesSearch(bed, patient, term);
    let cls = "bed-card " + (patient ? "occupied" : "empty");
    if (term && !matchesSearch) cls += " dimmed";
    else if (term && matchesSearch) cls += " match";
    const style = 'style="grid-row:'+bed.row_no+';grid-column:'+bed.col_no+';"';
    if (patient){
      html += '<div class="'+cls+'" '+style+' data-bed-id="'+bed.id+'" data-patient-id="'+patient.id+'">' +
        '<div class="bed-label">BED '+esc(bed.label)+'</div>' +
        '<div class="bed-patient-name">'+esc(patient.name)+'</div>' +
        '<div class="bed-diagnosis">'+esc(patient.diagnosis)+'</div>' +
        '<div class="bed-badges">'+badgesHtml(patient,3)+'</div>' +
      '</div>';
    } else {
      html += '<div class="'+cls+'" '+style+' data-bed-id="'+bed.id+'">' +
        '<div class="bed-label">BED '+esc(bed.label)+'</div>' +
        (bed.zone && bed.zone !== "Main ward" ? '<div class="bed-zone">'+esc(bed.zone)+'</div>' : '') +
        '<div class="bed-empty-text">EMPTY</div>' +
        '<div class="bed-add">+ Add patient</div>' +
      '</div>';
    }
  });
  grid.innerHTML = html || '<p class="empty-state">No beds match this filter.</p>';

  grid.querySelectorAll(".bed-card").forEach(function(card){
    card.addEventListener("click", function(){
      const bedId = card.getAttribute("data-bed-id");
      const patientId = card.getAttribute("data-patient-id");
      if (patientId) openPatientView(patientId);
      else openAdmissionModal(bedId);
    });
  });
}

function renderWard(){
  renderWardSummary();
  renderWardGrid();
}

function openAdmissionModal(bedId){
  const emptyBeds = state.beds.filter(function(b){
    return !state.patients.some(function(p){ return p.bed_id === b.id; });
  });
  const bedSelectHtml = bedId
    ? '<input type="text" disabled value="Bed ' + esc(bedLabel(bedId)) + '">'
    : '<select id="adm-bed">' + emptyBeds.map(function(b){ return '<option value="'+b.id+'">Bed '+esc(b.label)+'</option>'; }).join("") + '</select>';

  const body =
    '<div class="form-group"><label>Patient name *</label><input type="text" id="adm-name" placeholder="e.g. Nimal Perera"></div>' +
    '<div class="form-group"><label>Bed *</label>' + bedSelectHtml + '</div>' +
    '<div class="form-group"><label>Current diagnosis *</label><input type="text" id="adm-diagnosis" placeholder="e.g. Acute cholecystitis"></div>' +
    '<div class="form-group"><label>Patient status</label><select id="adm-status">' + optionsHtml(["New admission","Conservative","Pre-op","Post-op","Critical"], "New admission") + '</select></div>' +
    '<div class="form-row">' +
      '<div class="form-group"><label>Age</label><input type="number" id="adm-age" min="0" max="130"></div>' +
      '<div class="form-group"><label>BHT / hospital number</label><input type="text" id="adm-bht"></div>' +
    '</div>' +
    '<div class="form-group"><label>Date admitted</label><input type="date" id="adm-date" value="' + todayDateStr() + '"></div>';

  openModal("New Admission", body,
    '<button class="btn" id="adm-cancel">Cancel</button>' +
    '<button class="btn btn-primary" id="adm-save">Admit patient</button>');

  document.getElementById("adm-cancel").onclick = closeModal;
  document.getElementById("adm-save").onclick = async function(){
    const name = document.getElementById("adm-name").value.trim();
    const diagnosis = document.getElementById("adm-diagnosis").value.trim();
    const chosenBedId = bedId || (document.getElementById("adm-bed") && document.getElementById("adm-bed").value);
    if (!name){ showToast("Patient name is required.", "error"); return; }
    if (!diagnosis){ showToast("Diagnosis is required.", "error"); return; }
    if (!chosenBedId){ showToast("Please choose a bed.", "error"); return; }
    if (state.patients.some(function(p){ return p.bed_id === chosenBedId; })){
      showToast("That bed is already occupied.", "error"); return;
    }
    const btn = document.getElementById("adm-save"); btn.disabled = true;
    const age = document.getElementById("adm-age").value;
    const row = {
      name: name,
      diagnosis: diagnosis,
      bed_id: chosenBedId,
      status: document.getElementById("adm-status").value,
      age: age ? parseInt(age,10) : null,
      bht_no: document.getElementById("adm-bht").value.trim() || null,
      admitted_date: document.getElementById("adm-date").value || todayDateStr(),
      active: true,
      surgery_today: false,
      for_discharge: false,
      preop_checklist: {},
      updated_at: nowIso()
    };
    const res = await DB.insert("patients", row);
    btn.disabled = false;
    if (res.error){ showToast(friendlyError(res.error), "error"); return; }
    closeModal();
    showToast("Patient admitted to Bed " + bedLabel(chosenBedId) + ".", "success");
    await loadAll();
    renderCurrentView();
  };
}

// MOVE / SWAP BED
// ============================================================================
function openMoveModal(patient){
  const patientByBed = {};
  state.patients.forEach(function(p){ if (p.bed_id) patientByBed[p.bed_id] = p; });
  const beds = state.beds.slice().sort(function(a,b){ return parseInt(a.label,10) - parseInt(b.label,10) || a.label.localeCompare(b.label); });
  const grid = beds.map(function(b){
    const occ = patientByBed[b.id];
    const isCurrent = b.id === patient.bed_id;
    let cls = "bedpick " + (isCurrent ? "current" : (occ ? "occupied" : "empty"));
    const label = "Bed " + esc(b.label) + (occ && !isCurrent ? "<br><span style='font-weight:400'>"+esc(occ.name.split(" ")[0])+"</span>" : "");
    return '<div class="'+cls+'" data-bed-id="'+b.id+'"'+(isCurrent?"":'')+'>'+label+'</div>';
  }).join("");

  openModal("Move / Swap Bed — currently Bed " + bedLabel(patient.bed_id),
    '<p class="small muted" style="margin-bottom:8px;">Choose a bed. Empty beds move the patient directly; occupied beds offer a swap.</p>' +
    '<div class="bedpicker-grid">' + grid + '</div>',
    '<button class="btn" id="mv-cancel">Cancel</button>');
  document.getElementById("mv-cancel").onclick = closeModal;

  document.querySelectorAll("#modal-body .bedpick").forEach(function(el){
    el.addEventListener("click", async function(){
      const targetBedId = el.getAttribute("data-bed-id");
      if (targetBedId === patient.bed_id){ showToast("Patient is already in that bed.", "error"); return; }
      const targetPatient = patientByBed[targetBedId];
      if (targetPatient){
        confirmAction(
          "Swap " + patient.name + " in Bed " + bedLabel(patient.bed_id) + " with " + targetPatient.name + " in Bed " + bedLabel(targetBedId) + "?",
          async function(){
            const r1 = await DB.update("patients", patient.id, { bed_id: targetBedId, updated_at: nowIso() });
            if (r1.error){ showToast(friendlyError(r1.error), "error"); return; }
            const r2 = await DB.update("patients", targetPatient.id, { bed_id: patient.bed_id, updated_at: nowIso() });
            if (r2.error){ showToast(friendlyError(r2.error), "error"); return; }
            showToast("Swapped beds.", "success");
            await loadAll();
            state.currentPatientId = patient.id;
            renderCurrentView();
          }
        );
      } else {
        closeModal();
        const res = await DB.update("patients", patient.id, { bed_id: targetBedId, updated_at: nowIso() });
        if (res.error){ showToast(friendlyError(res.error), "error"); return; }
        showToast("Moved to Bed " + bedLabel(targetBedId) + ".", "success");
        await loadAll();
        state.currentPatientId = patient.id;
        renderCurrentView();
      }
    });
  });
}

// ---- OVERVIEW TAB ----
function renderOverviewTab(patient){
  const tasks = patientTasks(patient.id).slice().sort(function(a,b){
    if ((a.status==="Pending") !== (b.status==="Pending")) return a.status==="Pending" ? -1 : 1;
    return new Date(b.created_at) - new Date(a.created_at);
  });
  const rounds = patientRounds(patient.id).slice(0,3);

  const jobsHtml = tasks.length ? tasks.map(jobRowHtml).join("") : '<p class="empty-state">No outstanding jobs.</p>';

  const roundsHtml = rounds.length ? rounds.map(roundCardHtml).join("") :
    '<p class="empty-state">No rounds recorded yet.</p>';

  const timeline = buildTimeline(patient).slice(0,8);
  const timelineHtml = timeline.length ? timeline.map(function(t){
    return '<div class="timeline-item"><span class="timeline-time">'+fmtTime(t.time)+'</span>'+esc(t.text)+'</div>';
  }).join("") : '<p class="empty-state">No activity recorded yet.</p>';

  return (
    '<div class="card"><div class="section-title">Outstanding jobs <button class="btn btn-sm btn-primary" id="ov-add-job">+ Add job</button></div>' +
    '<div id="ov-jobs-list">' + jobsHtml + '</div></div>' +
    '<div class="card"><div class="section-title">Recent ward rounds <button class="btn btn-sm" data-tab="rounds" id="ov-view-rounds">+ Add round</button></div>' +
    '<div id="ov-rounds-list">' + roundsHtml + '</div></div>' +
    '<div class="card"><div class="section-title">Timeline</div><div>' + timelineHtml + '</div></div>'
  );
}
function jobRowHtml(t){
  return '<div class="job-row'+(t.status==="Done"?" done":"")+'" data-task-id="'+t.id+'">' +
    '<div class="row-top"><div><span class="row-bed-tag">'+esc(t.category)+'</span></div>' +
    '<button class="btn btn-sm '+(t.status==="Done"?"":"btn-success")+' job-toggle" data-task-id="'+t.id+'">'+(t.status==="Done"?"Pending":"Done")+'</button></div>' +
    '<div class="row-title">'+esc(t.description)+'</div>' +
    '<div class="row-sub">'+(t.status==="Done" ? "Completed "+fmtDateTime(t.completed_at) : "Created "+fmtDateTime(t.created_at))+' &middot; '+esc(t.source_type)+'</div>' +
  '</div>';
}
function roundCardHtml(r){
  const recs = Array.isArray(r.recommendations) ? r.recommendations : [];
  return '<div class="card" style="box-shadow:none;border-style:dashed;">' +
    '<div class="row-sub">'+fmtDateTime(r.round_at)+'</div>' +
    '<div class="row-title">'+esc(r.round_type)+'</div>' +
    '<div class="row-sub">'+esc(r.doctor_name||"")+'</div>' +
    (recs.length ? '<ul style="margin:8px 0 0 18px;padding:0;font-size:0.85rem;">' + recs.map(function(x){return '<li>'+esc(x)+'</li>';}).join("") + '</ul>' : "") +
  '</div>';
}
function buildTimeline(patient){
  const items = [];
  patientRounds(patient.id).forEach(function(r){ items.push({ time: r.round_at, text: r.round_type + (r.doctor_name?" — "+r.doctor_name:"") }); });
  patientReferrals(patient.id).forEach(function(r){
    items.push({ time: r.created_at, text: r.specialty + " referral requested" });
    if (r.completed_at) items.push({ time: r.completed_at, text: r.specialty + " referral completed" });
  });
  patientInvestigations(patient.id).forEach(function(i){
    items.push({ time: i.created_at, text: i.investigation + " requested" });
    if (i.completed_at) items.push({ time: i.completed_at, text: i.investigation + " reviewed" });
  });
  return items.sort(function(a,b){ return new Date(b.time) - new Date(a.time); });
}

function bindOverviewTab(patient){
  document.getElementById("ov-add-job").addEventListener("click", function(){ openAddJobModal(patient); });
  document.getElementById("ov-view-rounds").addEventListener("click", function(){ state.currentPatientTab = "rounds"; renderPatientView(); });
  document.getElementById("ov-jobs-list").querySelectorAll(".job-toggle").forEach(function(btn){
    btn.addEventListener("click", function(){ toggleTaskStatus(btn.getAttribute("data-task-id")); });
  });
}

async function toggleTaskStatus(taskId){
  const t = byId(state.tasks, taskId);
  if (!t) return;
  const newStatus = t.status === "Done" ? "Pending" : "Done";
  const patch = { status: newStatus, completed_at: newStatus === "Done" ? nowIso() : null };
  const res = await DB.update("tasks", taskId, patch);
  if (res.error){ showToast(friendlyError(res.error), "error"); return; }
  if (newStatus === "Done") await autoCompleteLinked(t);
  await loadAll();
  renderCurrentView();
}

    });

function bindReferralsTab(patient){
  document.getElementById("rf-add").addEventListener("click", function(){ openAddReferralModal(patient); });
  document.querySelectorAll(".rf-save").forEach(function(btn){
    btn.addEventListener("click", async function(){
      const id = btn.getAttribute("data-id");
      const status = document.querySelector('.rf-status[data-id="'+id+'"]').value;
      const recommendation = document.querySelector('.rf-rec[data-id="'+id+'"]').value.trim();
      const r = byId(state.referrals, id);
      const patch = { status: status, recommendation: recommendation || null };
      const wasCompleted = r.status === "Completed";
      if (status === "Completed" && !wasCompleted) patch.completed_at = nowIso();
      if (status !== "Completed") patch.completed_at = null;
      const res = await DB.update("referrals", id, patch);
      if (res.error){ showToast(friendlyError(res.error), "error"); return; }
      if (status === "Completed" && !wasCompleted){
        const linkedTask = state.tasks.find(function(t){ return t.source_type === "Referral" && t.source_id === id; });
        if (linkedTask && linkedTask.status !== "Done"){
          await DB.update("tasks", linkedTask.id, { status: "Done", completed_at: nowIso() });
        }
      }
      showToast("Referral updated.", "success");
      await loadAll();
      renderCurrentView();
    });
  });
}

function bindTheatreTab(patient){

async function setSurgeryToday(patient, val){
  const patch = { surgery_today: val, updated_at: nowIso() };
  if (val && patient.status !== "Post-op") patch.status = "Pre-op";
  const res = await DB.update("patients", patient.id, patch);
  if (res.error){ showToast(friendlyError(res.error), "error"); return; }
  showToast(val ? "Marked for theatre today." : "Removed from theatre list.", "success");
  await loadAll();
  renderCurrentView();
}
async function saveChecklist(patient){
  const checklist = {};
  document.querySelectorAll(".preop-check").forEach(function(cb){
    checklist[cb.getAttribute("data-item")] = cb.checked;
  });
  const otherText = document.getElementById("th-other").value.trim();
  const res = await DB.update("patients", patient.id, { preop_checklist: checklist, preop_other: otherText || null, updated_at: nowIso() });
  if (res.error){ showToast(friendlyError(res.error), "error"); return; }

  // Reconcile jobs: unchecked items get/keep a pending job; checked items complete their job.
  const existingTasks = patientTasks(patient.id).filter(function(t){ return t.source_type === "Pre-op"; });
  for (const item of PREOP_ITEMS){
    const sourceId = patient.id + ":" + item;
    const existing = existingTasks.find(function(t){ return t.source_id === sourceId; });
    if (checklist[item]){
      if (existing && existing.status !== "Done") await DB.update("tasks", existing.id, { status: "Done", completed_at: nowIso() });
    } else {
      if (!existing){
        await DB.insert("tasks", { patient_id: patient.id, category: "Theatre", description: "Pre-op: " + item, status: "Pending", source_type: "Pre-op", source_id: sourceId });
      } else if (existing.status === "Done"){
        await DB.update("tasks", existing.id, { status: "Pending", completed_at: null });
      }
    }
  }
  const otherSourceId = patient.id + ":other";
  const existingOther = existingTasks.find(function(t){ return t.source_id === otherSourceId; });
  if (otherText){
    if (!existingOther){
      await DB.insert("tasks", { patient_id: patient.id, category: "Theatre", description: "Pre-op: " + otherText, status: "Pending", source_type: "Pre-op", source_id: otherSourceId });
    } else if (existingOther.description !== "Pre-op: " + otherText){
      await DB.update("tasks", existingOther.id, { description: "Pre-op: " + otherText });
    }
  } else if (existingOther && existingOther.status !== "Done"){
    await DB.update("tasks", existingOther.id, { status: "Done", completed_at: nowIso() });
  }

  showToast("Checklist saved.", "success");
  await loadAll();
  renderCurrentView();
}

function renderJobsView(){
  const term = state.jobsSearch.trim().toLowerCase();
  const filter = state.jobsFilter;
  let tasks = state.tasks.slice();
  if (filter === "outstanding") tasks = tasks.filter(function(t){ return t.status === "Pending"; });
  else if (filter === "done") tasks = tasks.filter(function(t){ return t.status === "Done"; });

  if (term){
    tasks = tasks.filter(function(t){
      const p = byId(state.patients, t.patient_id);
      const hay = (t.description + " " + t.category + " " + (p?p.name:"") + " " + (p?bedLabel(p.bed_id):"")).toLowerCase();
      return hay.indexOf(term) !== -1;
    });
  }
  tasks.sort(function(a,b){
    if ((a.status==="Pending") !== (b.status==="Pending")) return a.status==="Pending" ? -1 : 1;
    return new Date(b.created_at) - new Date(a.created_at);
  });

  const list = document.getElementById("jobs-list");
  if (tasks.length === 0){
    list.innerHTML = '<p class="empty-state">No outstanding jobs.</p>';
    return;
  }
  list.innerHTML = tasks.map(function(t){
    const p = byId(state.patients, t.patient_id);
    return '<div class="job-row'+(t.status==="Done"?" done":"")+'">' +
      '<div class="row-top"><div>' +
        '<span class="row-bed-tag">Bed '+(p?esc(bedLabel(p.bed_id)):"?")+'</span> ' +
        '<span class="row-sub">'+(p?esc(p.name):"Unknown patient")+'</span>' +
      '</div></div>' +
      '<div class="row-title">'+esc(t.description)+'</div>' +
      '<div class="row-sub">'+esc(t.category)+' &middot; '+t.status+'</div>' +
      '<div class="row-actions">' +
        '<button class="btn btn-sm '+(t.status==="Done"?"":"btn-success")+' gj-toggle" data-id="'+t.id+'">'+(t.status==="Done"?"Mark pending":"DONE")+'</button>' +
        (p ? '<button class="btn btn-sm gj-open" data-pid="'+p.id+'">OPEN PATIENT</button>' : '') +
      '</div>' +
    '</div>';
  }).join("");

  list.querySelectorAll(".gj-toggle").forEach(function(btn){
    btn.addEventListener("click", function(){ toggleTaskStatus(btn.getAttribute("data-id")); });
  });
  list.querySelectorAll(".gj-open").forEach(function(btn){
    btn.addEventListener("click", function(){ openPatientView(btn.getAttribute("data-pid")); });
  });
}

        '<span class="row-bed-tag">Bed '+esc(bedLabel(p.bed_id))+'</span> <span class="row-sub">'+esc(p.name)+'</span>' +
      '</div></div>' +
      '<div class="row-title">'+esc(p.diagnosis)+(pod!==null?' &middot; POD '+pod:'')+'</div>' +
      '<div class="row-sub">'+(p.discharge_review_required ? (esc(p.discharge_review_where||"Review")+" review "+esc(p.discharge_review_when||"")) : "No review specified")+'</div>' +
      '<div class="row-sub">'+jobs+(jobs===1?" job remaining":" jobs remaining")+'</div>' +
      '<div class="row-actions">' +
        '<button class="btn btn-sm ds-open" data-pid="'+p.id+'">OPEN PATIENT</button>' +
        '<button class="btn btn-sm btn-danger ds-discharge" data-pid="'+p.id+'">MARK DISCHARGED</button>' +
      '</div>' +
    '</div>';
  }).join("");
  list.querySelectorAll(".ds-open").forEach(function(btn){
    btn.addEventListener("click", function(){ openPatientView(btn.getAttribute("data-pid")); });
  });
  list.querySelectorAll(".ds-discharge").forEach(function(btn){
    btn.addEventListener("click", function(){
      const p = byId(state.patients, btn.getAttribute("data-pid"));
      confirmAction("Mark " + p.name + " (Bed " + bedLabel(p.bed_id) + ") as discharged? The bed will become empty.", async function(){
        const res = await DB.update("patients", p.id, { active: false, status: "Discharged", discharged_at: nowIso(), bed_id: null, updated_at: nowIso() });
        if (res.error){ showToast(friendlyError(res.error), "error"); return; }
        showToast(p.name + " discharged.", "success");
        await loadAll();
        renderCurrentView();
      });
    });
  });
}

// ============================================================================
// SETTINGS VIEW
// ============================================================================
function renderSettingsView(){
  document.getElementById("settings-conn-info").innerHTML = USE_SUPABASE
    ? '<span class="conn-dot"></span>Connected to Supabase.'
    : '<span class="conn-dot off"></span>Demo mode — data is only saved in this browser (localStorage). Configure SUPABASE_URL / SUPABASE_KEY at the top of index.html to use a real database.';

  const staffList = document.getElementById("staff-list");
  if (state.staff.length === 0){
    staffList.innerHTML = '<p class="empty-state">No staff saved yet.</p>';
  } else {
    staffList.innerHTML = state.staff.slice().sort(function(a,b){return a.name.localeCompare(b.name);}).map(function(s){
      return '<div class="staff-row"><div><strong>'+esc(s.name)+'</strong> <span class="staff-role-tag">'+esc(s.role)+'</span></div>' +
        '<div><button class="btn btn-sm st-edit" data-id="'+s.id+'">Edit</button> <button class="btn btn-sm btn-danger st-remove" data-id="'+s.id+'">Remove</button></div></div>';
    }).join("");
    staffList.querySelectorAll(".st-edit").forEach(function(btn){ btn.addEventListener("click", function(){ openStaffModal(byId(state.staff, btn.getAttribute("data-id"))); }); });
    staffList.querySelectorAll(".st-remove").forEach(function(btn){
      btn.addEventListener("click", function(){
        const s = byId(state.staff, btn.getAttribute("data-id"));
        confirmAction("Remove " + s.name + " from the staff list? Past rounds already saved will keep showing their name.", async function(){
          const res = await DB.remove("staff", s.id);
          if (res.error){ showToast(friendlyError(res.error), "error"); return; }
          showToast("Staff member removed.", "success");
          await loadAll();
          renderCurrentView();
        });
      });
    });
  }

  renderLayoutTable();
}

function openStaffModal(staff){
  const isEdit = !!staff;
  const body =
    '<div class="form-group"><label>Name *</label><input type="text" id="stf-name" value="'+(isEdit?esc(staff.name):"")+'"></div>' +
    '<div class="form-group"><label>Role *</label><select id="stf-role">'+optionsHtml(["Consultant","Registrar","SHO"], isEdit?staff.role:"SHO")+'</select></div>';
  openModal(isEdit ? "Edit Doctor" : "Add Doctor", body,
    '<button class="btn" id="stf-cancel">Cancel</button>' +
    '<button class="btn btn-primary" id="stf-save">Save</button>');
  document.getElementById("stf-cancel").onclick = closeModal;
  document.getElementById("stf-save").onclick = async function(){
    const name = document.getElementById("stf-name").value.trim();
    if (!name){ showToast("Name is required.", "error"); return; }
    const role = document.getElementById("stf-role").value;
    const res = isEdit
      ? await DB.update("staff", staff.id, { name: name, role: role })
      : await DB.insert("staff", { name: name, role: role });
    if (res.error){ showToast(friendlyError(res.error), "error"); return; }
    closeModal();
    showToast("Staff saved.", "success");
    await loadAll();
    renderCurrentView();
  };
}

function renderLayoutTable(){
  const tbody = document.getElementById("layout-table-body");
  const beds = state.beds.slice().sort(function(a,b){
    return (a.row_no - b.row_no) || (a.col_no - b.col_no) || a.label.localeCompare(b.label, undefined, {numeric:true});
  });
  tbody.innerHTML = beds.map(function(b){
    return '<tr data-bed-id="'+b.id+'">' +
      '<td><strong>'+esc(b.label)+'</strong></td>' +
      '<td><input type="number" class="ly-row" value="'+b.row_no+'" min="1"></td>' +
      '<td><input type="number" class="ly-col" value="'+b.col_no+'" min="1"></td>' +
      '<td><input type="text" class="ly-zone" value="'+esc(b.zone||"")+'"></td>' +
    '</tr>';
  }).join("");
}

document.getElementById("btn-add-staff").addEventListener("click", function(){ openStaffModal(null); });
document.getElementById("btn-save-layout").addEventListener("click", async function(){
  const rows = document.querySelectorAll("#layout-table-body tr");
  const btn = document.getElementById("btn-save-layout");
  btn.disabled = true;
  let anyError = null;
  for (const row of rows){
    const bedId = row.getAttribute("data-bed-id");
    const rowNo = parseInt(row.querySelector(".ly-row").value, 10) || 1;
    const colNo = parseInt(row.querySelector(".ly-col").value, 10) || 1;
    const zone = row.querySelector(".ly-zone").value.trim() || null;
    const bed = byId(state.beds, bedId);
    if (bed && (bed.row_no !== rowNo || bed.col_no !== colNo || bed.zone !== zone)){
      const res = await DB.update("beds", bedId, { row_no: rowNo, col_no: colNo, zone: zone });
      if (res.error) anyError = res.error;
    }
  }
  btn.disabled = false;
  if (anyError){ showToast(friendlyError(anyError), "error"); return; }
  showToast("Ward layout saved.", "success");
  await loadAll();
  renderCurrentView();
});

// ============================================================================
// NAVIGATION / VIEW SWITCHING
// ============================================================================
function switchView(view){
  state.currentView = view;
  document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("active"); });
  document.getElementById("view-" + view).classList.add("active");
  document.querySelectorAll("#main-nav .nav-btn").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-view") === view);
  });
  window.scrollTo(0,0);
  renderCurrentView();
}

function renderCurrentView(){
  switch(state.currentView){
    case "ward": renderWard(); break;
    case "jobs": renderJobsView(); break;
    case "theatre": renderTheatreView(); break;
    case "discharges": renderDischargesView(); break;
    case "settings": renderSettingsView(); break;
    case "patient": renderPatientView(); break;
  }
  // Always keep the nav job counter fresh regardless of active view.
  const s = computeWardSummary();
  const navCount = document.getElementById("nav-jobs-count");
  if (s.pendingJobs > 0){ navCount.hidden = false; navCount.textContent = s.pendingJobs; }
  else { navCount.hidden = true; }
}

document.getElementById("main-nav").addEventListener("click", function(e){
  const btn = e.target.closest(".nav-btn");
  if (!btn) return;
  switchView(btn.getAttribute("data-view"));
});

document.getElementById("btn-refresh").addEventListener("click", async function(){
  showToast("Refreshing...", "");
  await loadAll();
  renderCurrentView();
});

document.getElementById("btn-new-admission").addEventListener("click", function(){ openAdmissionModal(null); });

document.getElementById("ward-search").addEventListener("input", function(e){
  state.wardSearch = e.target.value;
  renderWardGrid();
});
document.getElementById("ward-filter").addEventListener("change", function(e){
  state.wardFilter = e.target.value;
  renderWardGrid();
});
document.getElementById("jobs-search").addEventListener("input", function(e){
  state.jobsSearch = e.target.value;
  renderJobsView();
});
document.getElementById("jobs-filter").addEventListener("change", function(e){
  state.jobsFilter = e.target.value;
  renderJobsView();
});

// Keyboard shortcut: "/" focuses ward search (desktop), unless typing already.
document.addEventListener("keydown", function(e){
  if (e.key !== "/") return;
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  if (state.currentView !== "ward") return;
  e.preventDefault();
  document.getElementById("ward-search").focus();
});

// ============================================================================
// APP INIT
// ============================================================================
async function initApp(){
  updateCurrentDate();

  if (SUPABASE_CONFIGURED){
    try {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      USE_SUPABASE = true;
    } catch(e){
      console.error("Failed to create Supabase client, falling back to demo mode.", e);
      showToast("Could not connect to Supabase. Running in demo mode.", "error");
      supabaseClient = null;
      USE_SUPABASE = false;
    }
  }
  document.getElementById("demo-badge").hidden = USE_SUPABASE;
  if (!USE_SUPABASE){
    loadLocalDB();
  }

  const ok = await loadAll();
  if (ok && state.beds.length === 0 && !USE_SUPABASE){
    seedLocalBeds();
    saveLocalDB();
    await loadAll();
  }
  renderCurrentView();
  if (USE_SUPABASE) setupRealtime();
}

initApp();
</script>
</body>
</html>
